name: Sample Book App

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Print process name
        run: echo "Building sample-book-app..."
  deploy-dev:
    runs-on: self-hosted
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Print process name
        run: echo "Deployment to DEV env..."
  test-dev:
    runs-on: self-hosted
    needs: [deploy-dev]
    steps:
      - uses: actions/checkout@v4
      - name: Print process name
        run: echo "Testing sample-book-app on DEV env..."   
  deploy-stg:
    runs-on: self-hosted
    needs: [test-dev]
    steps:
      - uses: actions/checkout@v4
      - name: Print process name
        run: echo "Deployment to STG env..."
  test-stg:
    runs-on: self-hosted
    needs: [deploy-stg]
    steps:
      - uses: actions/checkout@v4
      - name: Print process name
        run: echo "Testing sample-book-app on STG env..."   
  deploy-prd:
    runs-on: self-hosted
    needs: [test-stg]
    steps:
      - uses: actions/checkout@v4
      - name: Print process name
        run: echo "Deployment to PRD env..."
  test-prd:
    runs-on: self-hosted
    needs: [deploy-prd]
    steps:
      - uses: actions/checkout@v4
      - name: Print process name
        run: echo "Testing sample-book-app on PRD env..."          
